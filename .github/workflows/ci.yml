name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-app:
    name: Build + Prisma + CRM Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raices_puntanas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raices_puntanas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raices_puntanas?schema=public
      JWT_SECRET: ci-super-secret-key-123456
      REFRESH_TOKEN_SECRET: ci-refresh-secret-key-123456
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 14
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_MINUTES: 15
      FRONTEND_URL: http://localhost:5173
      FRONTEND_ORIGIN: http://localhost:5173
      SMTP_FROM: no-reply@raicespuntanas.local
      SETUP_ADMIN_KEY: ci-bootstrap-admin-key
      API_BASE_URL: http://localhost:3001/api
      CRM_SMOKE_API_BASE_URL: http://localhost:3001/api
      VITE_API_URL: http://localhost:3001/api
      VITE_GOOGLE_MAPS_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Prisma generate
        run: npm run prisma:generate
        working-directory: backend

      - name: Prisma migrate deploy
        run: npm run prisma:deploy
        working-directory: backend

      - name: Seed database
        run: npm run db:seed
        working-directory: backend

      - name: Validate backend syntax
        run: |
          node --check backend/src/app.js
          node --check backend/src/config/env.js
          node --check backend/src/server.js

      - name: Build frontend
        run: npm run build

      - name: Start backend
        shell: bash
        run: |
          cd backend
          node src/server.js > /tmp/backend-ci.log 2>&1 &
          echo $! > /tmp/backend-ci.pid

      - name: Wait for backend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend no respondio en /health" >&2
          exit 1

      - name: Run CRM smoke test
        run: npm run crm:smoke

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: /tmp/backend-ci.log
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/backend-ci.pid ]; then
            kill "$(cat /tmp/backend-ci.pid)" || true
          fi

  validate-docker-prod:
    name: Docker Compose Prod + CRM Smoke
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_MAPS_API_KEY: ""
      CRM_SMOKE_API_BASE_URL: http://localhost:8080/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Docker Compose prod up
        run: docker compose -f docker-compose.prod.yml up --build -d

      - name: Wait for frontend
        shell: bash
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend Nginx no respondio" >&2
          exit 1

      - name: Wait for API via Nginx
        shell: bash
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/api/lotes?limit=1 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API via Nginx no respondio" >&2
          exit 1

      - name: Run CRM smoke test against production compose
        run: npm run crm:smoke

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Docker Compose prod down
        if: always()
        run: docker compose -f docker-compose.prod.yml down --remove-orphans
