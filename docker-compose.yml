services:
  postgres:
    image: postgres:16-alpine
    container_name: raices-puntanas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raices_puntanas
    ports:
      - "5432:5432"
    volumes:
      - pg_raices_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raices_puntanas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raices-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raices-puntanas-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - raices-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raices-puntanas-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    networks:
      - raices-network

volumes:
  pg_raices_data:

networks:
  raices-network:
