services:
  postgres:
    image: postgres:16-alpine
    container_name: raices-puntanas-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raices_puntanas
    ports:
      - "5432:5432"
    volumes:
      - pg_raices_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raices_puntanas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raices-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raices-puntanas-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/raices_puntanas?schema=public
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      UPLOADS_DIR: /app/uploads
    volumes:
      - backend_uploads_prod_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - raices-prod-network

  frontend-nginx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: raices-puntanas-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 80
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - raices-prod-network

volumes:
  pg_raices_prod_data:
  backend_uploads_prod_data:

networks:
  raices-prod-network:
